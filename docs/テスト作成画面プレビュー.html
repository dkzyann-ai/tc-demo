<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テスト作成ツール UIプレビュー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f1;color:#173046;font-family:"Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;min-width:940px;margin:0 auto;padding:18px 22px 30px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{display:grid;gap:2px}.brand small{color:#36735f;font-weight:700}.brand strong{font-size:20px;letter-spacing:.03em}.nav{display:flex;gap:7px}.nav-button,.secondary,.selector-button{min-height:38px;padding:8px 14px;border:1px solid #dbe4da;border-radius:8px;background:#fff;color:#173046;font-weight:700}.nav-button.is-active{border-color:#e6efea;background:#e6efea;color:#36735f}.screen{display:none;padding:24px;border:1px solid #dce5dc;border-radius:12px;background:#fff}.screen.is-active{display:block}.toolbar{display:flex;align-items:center;gap:9px;padding-bottom:18px;border-bottom:1px solid #e3e9e2}.selector{position:relative}.selector-button{min-width:112px;text-align:left}.subject-button{min-width:126px}.tab-list{position:absolute;z-index:2;top:44px;left:0;display:none;min-width:150px;gap:4px;padding:7px;border:1px solid #dce5dc;border-radius:9px;background:#fff;box-shadow:0 10px 28px rgb(23 48 70 / 14%);flex-direction:column}.tab-list.is-open{display:flex}.vertical-tab{min-height:34px;padding:6px 10px;border:0;border-radius:6px;background:transparent;color:#657486;text-align:left;white-space:nowrap}.vertical-tab.is-active{background:#e6efea;color:#36735f;font-weight:800}.title-input{flex:1;min-height:39px;padding:8px 12px;border:1px solid #d7e0d7;border-radius:8px;color:#173046}.primary{min-height:39px;padding:8px 15px;border:1px solid #4f806a;border-radius:8px;background:#4f806a;color:#fff;font-weight:800}.grid{display:grid;grid-template-columns:29% 1fr 26%;gap:16px;margin-top:18px}.pane{min-height:500px;padding:16px;border:1px solid #dce5dc;border-radius:10px;background:#fff}.pane-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px;color:#173046;font-size:14px;font-weight:800}.muted{color:#657486;font-size:11px;font-weight:400}.problem-row{display:block;width:100%;margin:8px 0;padding:10px;border:1px solid #dce5dc;border-radius:8px;background:#fff;color:#173046;text-align:left}.problem-row.is-selected{border-color:#78a18d;background:#eaf3ed}.problem-row b{display:block;color:#173046;font-size:12px}.problem-row span{color:#657486;font-size:11px}.paper-area{min-width:0}.paper-tabs{display:flex;gap:5px;margin-bottom:12px}.paper-tab{border:0;border-radius:6px;padding:7px 10px;background:transparent;color:#657486}.paper-tab.is-active{background:#e6efea;color:#36735f;font-weight:800}.paper{min-height:500px;padding:27px 32px;border:1px solid #dce5dc;border-radius:10px;background:#fff}.paper-head{display:flex;justify-content:space-between;color:#657486;font-size:11px}.paper h1{margin:10px 0 14px;padding-bottom:10px;border-bottom:2px solid #173046;color:#173046;font-size:19px}.question{padding:13px 0;border-bottom:1px dashed #dce5dc;font-size:13px;line-height:1.7}.question b{margin-right:6px}.points{color:#36735f;font-size:11px;white-space:nowrap}.question-image{display:block;max-width:100%;max-height:160px;margin:10px 0;border:1px solid #dce5dc;border-radius:7px;object-fit:contain}.image-slot{display:grid;height:108px;place-items:center;margin:10px 0;border:1px dashed #8db29e;border-radius:7px;background:#f7fbf7;color:#4f806a;font-size:12px}.graph{width:210px;height:88px}.answer{margin-top:6px;color:#36735f;font-weight:700}.placeholder{display:grid;min-height:350px;place-items:center;color:#8a978d;font-size:13px;text-align:center}.selected-row{display:grid;grid-template-columns:24px 1fr 58px;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid #e3e9e2}.selected-row b{display:block;font-size:12px}.selected-row span{color:#657486;font-size:11px}.point-input{width:58px;min-height:32px;padding:4px 6px;border:1px solid #d7e0d7;border-radius:6px;text-align:right}.order{padding:4px 6px;border:1px solid #dbe4da;border-radius:6px;background:#fff;color:#657486}.total{margin-top:14px;padding:12px;border-radius:8px;background:#f3f6f1;color:#36735f;font-size:13px;font-weight:800;text-align:right}.hint{margin:12px 0 0;color:#657486;font-size:11px;line-height:1.6}.screen-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.screen-head h1{margin:0;font-size:17px}.screen-head p{margin:5px 0 0;color:#657486;font-size:13px}.history-table{width:100%;border-collapse:collapse}.history-table th,.history-table td{padding:14px 12px;border-bottom:1px solid #e3e9e2;text-align:left;font-size:13px}.history-table th{color:#657486;font-weight:500}.history-table td:last-child{text-align:right}.mini{padding:7px 10px;border:1px solid #dbe4da;border-radius:7px;background:#fff;color:#173046;font-weight:700}.form-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}.field{display:grid;gap:6px;margin-bottom:16px;color:#657486;font-size:13px}.field input,.field select,.field textarea{width:100%;min-height:40px;padding:9px 12px;border:1px solid #d7e0d7;border-radius:8px;color:#173046;background:#fff}.field textarea{min-height:118px;resize:vertical}.two-column{display:grid;grid-template-columns:1fr 1fr;gap:16px}.image-input{padding:9px 0}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid #e3e9e2}@media(max-width:960px){.app{min-width:0;padding:14px}.grid,.form-grid,.two-column{grid-template-columns:1fr}.pane,.paper{min-height:auto}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><small>Beta</small><strong>テスト作成ツール</strong></div>
    <nav class="nav" aria-label="画面移動"><button class="nav-button is-active" type="button" data-screen="create">テスト作成</button><button class="nav-button" type="button" data-screen="history">テスト履歴</button><button class="nav-button" type="button" data-screen="problem-create">問題作成</button></nav>
  </header>

  <main class="screen is-active" id="create">
    <div class="toolbar">
      <div class="selector"><button class="selector-button" id="type-trigger" type="button">小テスト ▾</button><div class="tab-list" id="type-tabs"><button class="vertical-tab is-active" type="button" data-type="小テスト">小テスト</button><button class="vertical-tab" type="button" data-type="定期テスト">定期テスト</button></div></div>
      <div class="selector"><button class="selector-button subject-button" id="subject-trigger" type="button">数学Ⅰ・A ▾</button><div class="tab-list" id="subject-tabs"><button class="vertical-tab is-active" type="button" data-subject="数学Ⅰ・A">数学Ⅰ・A</button><button class="vertical-tab" type="button" data-subject="数学Ⅰ・B">数学Ⅰ・B</button><button class="vertical-tab" type="button" data-subject="数学Ⅱ・B">数学Ⅱ・B</button><button class="vertical-tab" type="button" data-subject="数学Ⅲ・C">数学Ⅲ・C</button></div></div>
      <input class="title-input" id="test-title" value="無題の小テスト" aria-label="テスト名"><button class="primary" type="button">テストを保存</button>
    </div>
    <div class="grid">
      <aside class="pane"><div class="pane-title">問題一覧</div><div id="problem-list"></div></aside>
      <div class="paper-area"><div class="paper-tabs"><button class="paper-tab is-active" type="button" data-paper="question">問題用紙</button><button class="paper-tab" type="button" data-paper="answer">答え</button></div><article class="paper"><div class="paper-head"><span id="test-type-label">小テスト／数学Ⅰ・A</span><span>氏名：＿＿＿＿＿＿＿＿＿＿＿＿</span></div><h1 id="paper-title">無題の小テスト</h1><div id="paper-content"></div></article></div>
      <aside class="pane"><div class="pane-title">出題順・配点 <span class="muted" id="selected-count">0問</span></div><div id="selected-list"></div><div class="total" id="total">合計 0点</div><p class="hint">配点の数字を直接変更できます。上下ボタンで出題順も調整できます。</p></aside>
    </div>
  </main>

  <main class="screen" id="history">
    <div class="screen-head"><div><h1>テスト履歴</h1><p>保存済みのテストを開き、再編集・印刷できます。</p></div></div>
    <table class="history-table"><thead><tr><th>作成日時</th><th>テスト名</th><th>種別</th><th>問題数</th><th>合計点</th><th></th></tr></thead><tbody><tr><td>2026/08/01 18:30</td><td><strong>2次関数 小テスト</strong></td><td>小テスト</td><td>4問</td><td>25点</td><td><button class="mini" type="button" data-screen="create">再編集</button></td></tr><tr><td>2026/07/28 16:10</td><td><strong>場合の数 確認テスト</strong></td><td>定期テスト</td><td>3問</td><td>20点</td><td><button class="mini" type="button" data-screen="create">再編集</button></td></tr></tbody></table>
  </main>

  <main class="screen" id="problem-create">
    <div class="screen-head"><div><h1>問題作成</h1><p>作成・保存した問題は、テスト作成画面の問題一覧に表示されます。</p></div></div>
    <form id="problem-form">
      <div class="form-grid">
        <label class="field">問題名<input id="problem-name" required placeholder="例：2次関数の頂点"></label>
        <label class="field">科目<select id="problem-subject"><option>数学Ⅰ・A</option><option>数学Ⅰ・B</option><option>数学Ⅱ・B</option><option>数学Ⅲ・C</option></select></label>
        <label class="field">配点<input id="problem-points" type="number" min="1" value="5" required></label>
      </div>
      <label class="field">問題文<textarea id="problem-question" required placeholder="問題文を入力してください"></textarea></label>
      <div class="two-column"><label class="field">答え<textarea id="problem-answer" required placeholder="答えを入力してください"></textarea></label><label class="field">解説（任意）<textarea id="problem-explanation" placeholder="解説を入力してください"></textarea></label></div>
      <label class="field">画像（任意）<input class="image-input" id="problem-image" type="file" accept="image/*"></label>
      <div class="form-actions"><button class="secondary" type="button" data-screen="create">キャンセル</button><button class="primary" type="submit">問題を保存してテスト作成へ</button></div>
    </form>
  </main>
</div>

<script>
const problems=[{id:1,title:"因数分解の基本問題",unit:"数学Ⅰ・A・数と式",points:5,question:"x² − 5x + 6 を因数分解しなさい。",answer:"(x − 2)(x − 3)"},{id:2,title:"命題の真偽",unit:"数学Ⅰ・A・集合と命題",points:4,question:"次の命題の真偽を判定しなさい。",answer:"真"},{id:3,title:"2次関数のグラフ",unit:"数学Ⅰ・A・2次関数",points:6,question:"次のグラフの頂点の座標を答えなさい。",answer:"(2, −1)",image:"graph"},{id:4,title:"三角形の面積",unit:"数学Ⅰ・A・図形と計量",points:7,question:"a=5、b=6、C=60°のとき、△ABCの面積を求めなさい。",answer:"15√3 / 2"}];
let selected=[1,3],paperKind="question",testType="小テスト",subject="数学Ⅰ・A";
const problemList=document.getElementById("problem-list"),selectedList=document.getElementById("selected-list"),paperContent=document.getElementById("paper-content"),total=document.getElementById("total"),selectedCount=document.getElementById("selected-count"),titleInput=document.getElementById("test-title"),paperTitle=document.getElementById("paper-title"),typeLabel=document.getElementById("test-type-label");
function currentProblems(){return selected.map(id=>problems.find(problem=>problem.id===id)).filter(Boolean)}
function graphMarkup(){return '<div class="image-slot"><svg class="graph" viewBox="0 0 210 88" aria-label="添付された2次関数のグラフ"><path d="M18 7V78H198M26 68H190" stroke="#657486" fill="none"/><path d="M48 14Q104 98 166 20" stroke="#4f806a" stroke-width="3" fill="none"/><circle cx="104" cy="67" r="3" fill="#4f806a"/><text x="112" y="80" fill="#36735f" font-size="11">頂点</text></svg></div>'}
function imageMarkup(problem){if(problem.image==="graph")return graphMarkup();if(problem.image)return '<img class="question-image" src="'+problem.image+'" alt="問題に添付された画像">';return ""}
function render(){const chosen=currentProblems();problemList.innerHTML=problems.filter(problem=>problem.unit.startsWith(subject)).map(problem=>'<button class="problem-row '+(selected.includes(problem.id)?'is-selected':'')+'" type="button" data-select="'+problem.id+'"><b>'+problem.title+'</b><span>'+problem.unit+'・'+problem.points+'点</span></button>').join("")||'<div class="placeholder">この科目の問題はありません。<br>問題作成から追加してください。</div>';selectedList.innerHTML=chosen.length?chosen.map((problem,index)=>'<div class="selected-row"><button class="order" type="button" data-up="'+problem.id+'">↑</button><span><b>'+ (index+1)+'. '+problem.title+'</b><span>出題順を変更できます</span></span><input class="point-input" type="number" min="1" value="'+problem.points+'" data-points="'+problem.id+'" aria-label="'+problem.title+'の配点"></div>').join(""):'<div class="placeholder">左の「問題一覧」から<br>問題を選択してください</div>';paperContent.innerHTML=chosen.length?chosen.map((problem,index)=>'<div class="question"><b>第'+(index+1)+'問</b>'+problem.question+' <span class="points">（'+problem.points+'点）</span>'+(paperKind==="question"?imageMarkup(problem):"")+(paperKind==="answer"?'<div class="answer">正答：'+problem.answer+'</div>':"")+'</div>').join(""):'<div class="placeholder">左の「問題一覧」から<br>問題を選択してください</div>';selectedCount.textContent=chosen.length+"問";total.textContent="合計 "+chosen.reduce((sum,problem)=>sum+problem.points,0)+"点";document.querySelectorAll("[data-select]").forEach(button=>button.addEventListener("click",()=>{const id=Number(button.dataset.select);selected.includes(id)?selected=selected.filter(item=>item!==id):selected.push(id);render()}));document.querySelectorAll("[data-points]").forEach(input=>input.addEventListener("input",()=>{const problem=problems.find(item=>item.id===Number(input.dataset.points));problem.points=Math.max(1,Number(input.value)||1);render()}));document.querySelectorAll("[data-up]").forEach(button=>button.addEventListener("click",()=>{const index=selected.indexOf(Number(button.dataset.up));if(index>0)[selected[index-1],selected[index]]=[selected[index],selected[index-1]];render()}))}
function label(){typeLabel.textContent=testType+"／"+subject}
function openScreen(screen){document.querySelectorAll(".screen").forEach(item=>item.classList.toggle("is-active",item.id===screen));document.querySelectorAll(".nav-button").forEach(button=>button.classList.toggle("is-active",button.dataset.screen===screen))}
document.querySelectorAll("[data-screen]").forEach(button=>button.addEventListener("click",()=>openScreen(button.dataset.screen)));
document.getElementById("type-trigger").addEventListener("click",()=>document.getElementById("type-tabs").classList.toggle("is-open"));
document.getElementById("subject-trigger").addEventListener("click",()=>document.getElementById("subject-tabs").classList.toggle("is-open"));
document.querySelectorAll("[data-type]").forEach(button=>button.addEventListener("click",()=>{testType=button.dataset.type;document.querySelectorAll("[data-type]").forEach(tab=>tab.classList.toggle("is-active",tab===button));document.getElementById("type-trigger").textContent=testType+" ▾";document.getElementById("type-tabs").classList.remove("is-open");label()}));
document.querySelectorAll("[data-subject]").forEach(button=>button.addEventListener("click",()=>{subject=button.dataset.subject;document.querySelectorAll("[data-subject]").forEach(tab=>tab.classList.toggle("is-active",tab===button));document.getElementById("subject-trigger").textContent=subject+" ▾";document.getElementById("problem-subject").value=subject;document.getElementById("subject-tabs").classList.remove("is-open");label();render()}));
document.querySelectorAll("[data-paper]").forEach(button=>button.addEventListener("click",()=>{paperKind=button.dataset.paper;document.querySelectorAll("[data-paper]").forEach(tab=>tab.classList.toggle("is-active",tab===button));render()}));
titleInput.addEventListener("input",()=>paperTitle.textContent=titleInput.value||"無題のテスト");
document.getElementById("problem-form").addEventListener("submit",event=>{event.preventDefault();const file=document.getElementById("problem-image").files[0];const newProblem={id:Date.now(),title:document.getElementById("problem-name").value,unit:document.getElementById("problem-subject").value+"・自作問題",points:Math.max(1,Number(document.getElementById("problem-points").value)||1),question:document.getElementById("problem-question").value,answer:document.getElementById("problem-answer").value,image:file?URL.createObjectURL(file):""};problems.push(newProblem);subject=document.getElementById("problem-subject").value;selected.push(newProblem.id);document.getElementById("subject-trigger").textContent=subject+" ▾";document.querySelectorAll("[data-subject]").forEach(tab=>tab.classList.toggle("is-active",tab.dataset.subject===subject));label();event.target.reset();document.getElementById("problem-points").value=5;openScreen("create");render()});
render();
</script>
</body>
</html>
